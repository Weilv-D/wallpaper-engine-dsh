# Publish to npm via TRUSTED PUBLISHING (OIDC) — no long-lived token.
#
# Trigger: publishing a GitHub Release (tag MUST match package.json version,
# e.g. release tag "v0.1.1" ↔ package.json "0.1.1"), or manual dispatch.
#
# One-time setup (npm web):
#   Package → Settings → Trusted Publisher → GitHub Actions:
#     repository: Weilv-D/wallpaper-engine-dsh
#     workflow:   publish.yml
#     environment: (leave empty)
#   The npm CLI inside the runner (>= 11.5.1, ensured below) picks up the
#   OIDC token from GitHub automatically; --provenance attests the build.
#
# Fallback: if trusted publishing is unavailable, create a granular access
# token with publish rights, store it as the NPM_TOKEN repo secret, and
# uncomment the env block on the publish step.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # OIDC for npm trusted publishing + provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest

      # Quality gate — same as local prepublishOnly.
      - run: npm test
      - run: npm run build
      - run: npm run verify

      # On release runs, the tag must match package.json version.
      - name: assert release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG tag=$TAG"
          test "$PKG" = "$TAG"

      - run: npm publish --provenance --access public
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
