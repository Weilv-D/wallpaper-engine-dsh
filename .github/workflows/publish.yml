# Publish to npm via TRUSTED PUBLISHING (OIDC) — no long-lived token.
#
# Triggers:
#   - push a version tag (git tag v0.1.2 && git push origin v0.1.2) — the
#     normal path; the GitHub Release is created automatically at the end
#   - publishing a GitHub Release manually (tag must match package.json)
#   - manual dispatch from the Actions tab
# In every case the tag must equal package.json "version" (v prefix allowed).
#
# One-time setup (npm web):
#   Package → Settings → Trusted Publisher → GitHub Actions:
#     repository: Weilv-D/wallpaper-engine-dsh
#     workflow:   publish.yml
#     environment: (leave empty)
#   The npm CLI inside the runner (>= 11.5.1, ensured below) picks up the
#   OIDC token from GitHub automatically; --provenance attests the build.
#
# Fallback: if trusted publishing is unavailable, create a granular access
# token with publish rights, store it as the NPM_TOKEN repo secret, and
# uncomment the env block on the publish step.

name: publish

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # OIDC for npm trusted publishing + provenance
  contents: write # creating the GitHub Release on tag pushes

# A release created with a brand-new tag fires BOTH push:tags and
# release:published. Serialise them WITHOUT cancelling: an in-flight publish
# must never be killed mid-`npm publish`; the duplicate-version run simply
# fails harmlessly at the npm step instead.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; pin the major for
      # reproducibility instead of floating on npm@latest.
      - run: npm install -g npm@11

      # Quality gate — same as local prepublishOnly.
      - run: npm test
      - run: npm run build
      - run: npm run verify

      # Tag pushes and release runs carry a tag; it must match package.json.
      - name: assert tag matches package.json version
        if: github.event_name != 'workflow_dispatch'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG tag=$TAG"
          test "$PKG" = "$TAG"

      - run: npm publish --provenance --access public
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Deprecate everything older than this release: installs that pinned a
      # stale version print an upgrade warning at resolve time. best-effort —
      # if trusted publishing declines the command, the latest dist-tag still
      # routes all unpinned installs to the current version.
      - name: deprecate older versions
        run: |
          V=$(node -p "require('./package.json').version")
          npm deprecate "wallpaper-engine-dsh@<$V" "Upgrade to >=$V (npm i -g @deepseek-ai/dsh && dsh plugin --profile web update wallpaper-engine-dsh) — earlier builds are broken."
        continue-on-error: true

      # On tag pushes, create the matching GitHub Release with generated
      # notes. (On manual-release runs the release already exists.)
      - name: create GitHub release
        if: github.event_name == 'push'
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
